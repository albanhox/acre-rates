name: Update rates

on:
  schedule:
    # Every day at 13:15 UTC (9:15 am ET). Freddie Mac publishes Thursdays at noon ET, so
    # Thursday's run at 17:15 UTC below picks that up the same day.
    - cron: "15 13 * * *"
    - cron: "15 17 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node fetch-rates.js
      - name: Commit if changed
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet && echo "No change" || git commit -m "Rates as of $(node -p "require('./rates.json').asOf")" && git push
